name: Refresh calendar data

# Daily, not hourly like update-data.yml -- release/meeting dates don't
# change within a day the way price data does, and several of the
# sources scraped here (news-report-derived dates for Brazil, secondary
# aggregators for a couple of others) are exactly the kind of thing you
# don't want hammering a small central bank's press page 24 times a day.
# A single run per country is also just easier to read in the Actions
# log if something needs investigating.
on:
  schedule:
    # 06:00 UTC daily -- after the US/UK trading day's own overnight
    # news cycle has settled, before most of Europe's business day
    # starts, so a same-day reschedule (like NBP's real one this
    # session) has a reasonable chance of being caught same-day rather
    # than a day late.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Init pipeline log
        run: echo "" > calendar_pipeline_log.txt

      # ---- confirmed against each publisher's own real page structure,
      # tested against real fetched content, not just written on paper ----
      - name: Run fetch_calendar_us.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_us.py" >> calendar_pipeline_log.txt
          python fetch_calendar_us.py 2>&1 | tee -a calendar_pipeline_log.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Run fetch_calendar_uk.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_uk.py" >> calendar_pipeline_log.txt
          python fetch_calendar_uk.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ez.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_ez.py" >> calendar_pipeline_log.txt
          python fetch_calendar_ez.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_jp.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_jp.py" >> calendar_pipeline_log.txt
          python fetch_calendar_jp.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_jp_stats.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_jp_stats.py" >> calendar_pipeline_log.txt
          python fetch_calendar_jp_stats.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ca.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_ca.py" >> calendar_pipeline_log.txt
          python fetch_calendar_ca.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ca_stats.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_ca_stats.py (known incomplete, see script docstring)" >> calendar_pipeline_log.txt
          python fetch_calendar_ca_stats.py 2>&1 | tee -a calendar_pipeline_log.txt

      # ---- confirmed against each publisher's own real page structure ----
      - name: Run fetch_calendar_au.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_au.py" >> calendar_pipeline_log.txt
          python fetch_calendar_au.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_se.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_se.py" >> calendar_pipeline_log.txt
          python fetch_calendar_se.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_no.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_no.py" >> calendar_pipeline_log.txt
          python fetch_calendar_no.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_pl.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_pl.py" >> calendar_pipeline_log.txt
          python fetch_calendar_pl.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_il.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_il.py" >> calendar_pipeline_log.txt
          python fetch_calendar_il.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_cl.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_cl.py" >> calendar_pipeline_log.txt
          python fetch_calendar_cl.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ma.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_ma.py" >> calendar_pipeline_log.txt
          python fetch_calendar_ma.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_id.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_id.py" >> calendar_pipeline_log.txt
          python fetch_calendar_id.py 2>&1 | tee -a calendar_pipeline_log.txt

      # ---- weaker sourcing: news-report-derived or not yet fetched
      # live against the real primary page -- watch these ones' logs
      # first if something looks wrong ----
      - name: Run fetch_calendar_br.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_br.py (dates hardcoded from news reporting, not scraped -- see script docstring)" >> calendar_pipeline_log.txt
          python fetch_calendar_br.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_tr.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_tr.py (URL/pattern built from secondary reporting, not yet confirmed against tcmb.gov.tr directly)" >> calendar_pipeline_log.txt
          python fetch_calendar_tr.py 2>&1 | tee -a calendar_pipeline_log.txt

      - name: Show pipeline log
        if: always()
        run: cat calendar_pipeline_log.txt

      - name: Commit updated calendar data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data-calendar-*.json
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          git push

