name: Refresh trade partner data
on:
  schedule:
    # Once a day. Comtrade's underlying data doesn't change hour to hour --
    # this used to run on the same hourly cron as everything else, which
    # was needless load on the Comtrade API (and likely why it got called
    # "redundant" and removed on 2026-08-22). Offset away from midnight UTC
    # for the same reason the hourly workflow is offset from :00 -- avoid
    # the busiest instant on GitHub's shared scheduler
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd
      - name: Init pipeline log
        run: echo "" > pipeline_log.txt
      - name: Run fetch_uk_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_uk_trade_partners.py" >> pipeline_log.txt
          python fetch_uk_trade_partners.py 2>&1 | tee -a pipeline_log.txt
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - name: Run fetch_us_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_us_trade_partners.py" >> pipeline_log.txt
          python fetch_us_trade_partners.py 2>&1 | tee -a pipeline_log.txt
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - name: Run fetch_jp_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_jp_trade_partners.py" >> pipeline_log.txt
          python fetch_jp_trade_partners.py 2>&1 | tee -a pipeline_log.txt
