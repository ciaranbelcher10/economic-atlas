      - name: Run fetch_calendar_tr.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_tr.py (live: tcmb.gov.tr MPC calendar table, v1.9.59)" >> calendar_pipeline_log.txt
          python fetch_calendar_tr.py 2>&1 | tee -a calendar_pipeline_log.txt

      - name: Run fetch_calendar_is.py
        continue-on-error: true
