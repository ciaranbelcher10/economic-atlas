      # v1.9.42: put back past events the fetchers dropped (they write only
      # upcoming ones), from the committed files. Never fails the run.
      - name: Keep past calendar events
        continue-on-error: true
        run: |
          echo ">>> RUNNING calendar_history.py" >> calendar_pipeline_log.txt
          python calendar_history.py 2>&1 | tee -a calendar_pipeline_log.txt

      - name: Show pipeline log
        if: always()
        run: cat calendar_pipeline_log.txt

      - name: Commit updated calendar data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data-calendar-*.json
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          git push
