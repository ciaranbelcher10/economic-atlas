        run: |
          echo ">>> RUNNING fetch_calendar_ca.py" >> calendar_pipeline_log.txt
          python fetch_calendar_ca.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ca_stats.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_ca_stats.py (known incomplete, see script docstring)" >> calendar_pipeline_log.txt
          python fetch_calendar_ca_stats.py 2>&1 | tee -a calendar_pipeline_log.txt

      # ---- confirmed against each publisher's own real page structure ----
      - name: Run fetch_calendar_au.py
