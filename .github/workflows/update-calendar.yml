name: Refresh calendar data

# Daily, not hourly like update-data.yml -- release/meeting dates don't
# change within a day the way price data does, and several of the
# sources scraped here (news-report-derived dates for Brazil, secondary
# aggregators for a couple of others) are exactly the kind of thing you
# don't want hammering a small central bank's press page 24 times a day.
# A single run per country is also just easier to read in the Actions
# log if something needs investigating.
on:
  schedule:
    # 06:00 UTC daily -- after the US/UK trading day's own overnight
    # news cycle has settled, before most of Europe's business day
    # starts, so a same-day reschedule (like NBP's real one this
    # session) has a reasonable chance of being caught same-day rather
    # than a day late.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Init pipeline log
        run: echo "" > calendar_pipeline_log.txt

      # ---- confirmed against each publisher's own real page structure,
      # tested against real fetched content, not just written on paper ----
      - name: Run fetch_calendar_us.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_us.py" >> calendar_pipeline_log.txt
          python fetch_calendar_us.py 2>&1 | tee -a calendar_pipeline_log.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Run fetch_calendar_uk.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_calendar_uk.py" >> calendar_pipeline_log.txt
          python fetch_calendar_uk.py 2>&1 | tee -a calendar_pipeline_log.txt
      - name: Run fetch_calendar_ez.py
        continue-on-error: true
