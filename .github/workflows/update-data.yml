name: Refresh data
on:
  schedule:
    # Hourly, every day.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd
      - run: python fetch_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_us.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_ez.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_jp.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      - run: python fetch_in.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MOSPI_USERNAME: ${{ secrets.MOSPI_USERNAME }}
          MOSPI_PASSWORD: ${{ secrets.MOSPI_PASSWORD }}
      - run: python fetch_ca.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_au.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_kr.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_il.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_mx.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_br.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_za.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_uk_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_us_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_jp_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_in_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_ca_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_au_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_kr_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_il_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_mx_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_br_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_za_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_boe_mpc.py
      - run: python fetch_uk_inactivity_reasons.py
      - run: python fetch_uk_spending_cofog.py
      - run: python fetch_uk_age_breakdown.py
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data.json data-us.json data-ez.json data-jp.json data-in.json data-ca.json data-au.json data-kr.json data-il.json data-mx.json data-br.json data-za.json
          git add data-uk-trade-partners.json 2>/dev/null || true
          git add data-us-trade-partners.json 2>/dev/null || true
          git add data-jp-trade-partners.json 2>/dev/null || true
          git add data-in-trade-partners.json 2>/dev/null || true
          git add data-ca-trade-partners.json 2>/dev/null || true
          git add data-au-trade-partners.json 2>/dev/null || true
          git add data-kr-trade-partners.json 2>/dev/null || true
          git add data-il-trade-partners.json 2>/dev/null || true
          git add data-mx-trade-partners.json 2>/dev/null || true
          git add data-br-trade-partners.json 2>/dev/null || true
          git add data-za-trade-partners.json 2>/dev/null || true
          git add data-uk-mpc-votes.json 2>/dev/null || true
          git add data-uk-inactivity-reasons.json 2>/dev/null || true
          git add data-uk-spending-cofog.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
