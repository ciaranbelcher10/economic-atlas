name: Refresh data
on:
  schedule:
    # Hourly, every day 
        - cron: "38 * * * *" 
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd Pillow
      - name: Init pipeline log
        run: echo "" > pipeline_log.txt
      # Country fetchers, in a rotated order.
      #
      # These used to be 32 separate hardcoded steps, always in the same
      # sequence. The OECD SDMX host rate-limits the runner partway through,
      # so whichever countries sat at the end of the list absorbed every 429.
      # In the 2026-09-15 18:53 run that was Argentina, Sweden, Singapore,
      # Austria and Thailand: 6 CPI and 5 business-confidence series fell back
      # to carried-over data, and the same five lose out every hour because
      # the order never changes.
      #
      # Rotating by hour-of-day does not create more OECD budget. It spreads
      # the shortfall across all 30 countries instead of concentrating it on
      # the same five forever, so any single country is short roughly one run
      # in six rather than every run.
      #
      # fetch_data.py and fetch_us.py stay pinned at the front and in that
      # order: fetch_data.py writes data.json and data-us.json, and
      # fetch_us.py overwrites data-us.json immediately after, which is a
      # known and deliberately retained arrangement. Rotating them would
      # change which script's US output survives.
      - name: Run country fetchers (rotated by hour)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          MOSPI_USERNAME: ${{ secrets.MOSPI_USERNAME }}
          MOSPI_PASSWORD: ${{ secrets.MOSPI_PASSWORD }}
        run: |
          PINNED="fetch_data.py fetch_us.py"
          ROTATING="fetch_ez.py fetch_jp.py fetch_in.py fetch_ca.py fetch_au.py \
                    fetch_kr.py fetch_il.py fetch_mx.py fetch_br.py fetch_za.py \
                    fetch_ma.py fetch_de.py fetch_fr.py fetch_it.py fetch_es.py \
                    fetch_nl.py fetch_dk.py fetch_ie.py fetch_no.py fetch_cl.py \
                    fetch_co.py fetch_tr.py fetch_id.py fetch_pl.py fetch_ch.py \
                    fetch_ar.py fetch_se.py fetch_sg.py fetch_at.py fetch_th.py"

          set -- $ROTATING
          TOTAL=$#
          HOUR=$(date -u +%H)
          HOUR=${HOUR#0}
          HOUR=${HOUR:-0}
          OFFSET=$(( HOUR % TOTAL ))
          ORDERED=""
          i=0
          while [ $i -lt $TOTAL ]; do
            POS=$(( (OFFSET + i) % TOTAL + 1 ))
            # Braces are load-bearing: eval echo \$$POS builds "$10" for
            # position 10, which bash reads as ${1} followed by a literal
            # 0, producing names like "fetch_in.py0". ${10} is correct.
            ORDERED="$ORDERED $(eval echo "\${$POS}")"
            i=$(( i + 1 ))
          done

          echo ">>> rotation offset $OFFSET of $TOTAL (UTC hour $HOUR)" \
            >> pipeline_log.txt
          echo ">>> order:$PINNED$ORDERED" >> pipeline_log.txt

          for SCRIPT in $PINNED $ORDERED; do
            echo ">>> RUNNING $SCRIPT" >> pipeline_log.txt
            python "$SCRIPT" 2>&1 | tee -a pipeline_log.txt || \
              echo ">>> $SCRIPT exited non-zero, continuing" >> pipeline_log.txt
          done
      - name: Run fetch_boe_mpc.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_boe_mpc.py" >> pipeline_log.txt
          python fetch_boe_mpc.py 2>&1 | tee -a pipeline_log.txt
      - name: Run fetch_uk_inactivity_reasons.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_uk_inactivity_reasons.py" >> pipeline_log.txt
          python fetch_uk_inactivity_reasons.py 2>&1 | tee -a pipeline_log.txt
      - name: Run fetch_uk_spending_cofog.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_uk_spending_cofog.py" >> pipeline_log.txt
          python fetch_uk_spending_cofog.py 2>&1 | tee -a pipeline_log.txt
      - name: Run fetch_uk_age_breakdown.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_uk_age_breakdown.py" >> pipeline_log.txt
          python fetch_uk_age_breakdown.py 2>&1 | tee -a pipeline_log.txt
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data.json data-us.json data-ez.json data-jp.json data-in.json data-ca.json data-au.json data-kr.json data-il.json data-mx.json data-br.json data-za.json data-ma.json data-de.json data-fr.json data-it.json data-es.json data-nl.json data-dk.json data-ie.json data-no.json data-cl.json data-co.json data-tr.json data-id.json data-pl.json data-ch.json data-ar.json data-se.json data-sg.json data-at.json data-th.json
          git add data-uk-mpc-votes.json 2>/dev/null || true
          git add data-uk-inactivity-reasons.json 2>/dev/null || true
          git add data-uk-spending-cofog.json 2>/dev/null || true
          git add data-uk-age-breakdown.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
      - name: Regenerate indicator pages and OG cards
        continue-on-error: true
        run: |
          echo ">>> REGENERATING indicator pages and OG cards" >> pipeline_log.txt
          python generate_indicator_pages.py 2>&1 | tee -a pipeline_log.txt
          python generate_og_images.py 2>&1 | tee -a pipeline_log.txt
          # sitemap-fragment.xml is a build aid, not a served file
          rm -f indicators/sitemap-fragment.xml
          # keep the indicator lastmod dates honest now the pages have moved
          TODAY=$(date -u +%Y-%m-%d)
          sed -i -E "s#(<loc>https://theeconomicatlas\.com/indicators/[a-z0-9-]+</loc><lastmod>)[0-9]{4}-[0-9]{2}-[0-9]{2}#\1${TODAY}#g" sitemap.xml
          git add indicators/ embed/ og/ sitemap.xml
          git diff --cached --quiet || git commit -m "Regenerate indicator pages and OG cards"
          git push
      - name: Check data freshness
        run: python check_data_freshness.py
      - name: Send pipeline alert email
        if: false  # disabled Aug 2026 -- OECD's live business_confidence/cpi
        # endpoints were soft-failing across most countries on most runs,
        # meaning this fired an email almost every hour. The underlying
        # detection (pipeline_log.txt, freshness_alerts.json) is untouched --
        # check the Actions tab or the open data-freshness Issue whenever
        # you want to look, instead of it landing in the inbox. To
        # re-enable: delete the "if: false" line above.
        continue-on-error: true
        run: python send_pipeline_alert.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Report freshness status via GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('freshness_alerts.json', 'utf8'));
            const disappeared = result.disappeared_series || [];
            const problems = result.alerts.length + result.missing_or_unreadable_files.length + disappeared.length;
            const label = 'data-freshness';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const openIssue = existing[0];

            if (problems === 0) {
              if (openIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: 'All series are back within normal freshness range as of this run.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const lines = [
              `Checked at ${result.checked_at}. ${problems} issue(s) found.`, '',
            ];
            if (disappeared.length) {
              lines.push('### Series present last run, completely gone this run');
              lines.push('| Country | Series | File |');
              lines.push('|---|---|---|');
              for (const d of disappeared) {
                lines.push(`| ${d.country} | ${d.key} | ${d.file} |`);
              }
              lines.push('');
            }
            if (result.alerts.length) {
              lines.push('### Genuinely stale series (3x past normal update cadence)');
              lines.push('| Country | Series | Last published | Days overdue |');
              lines.push('|---|---|---|---|');
              for (const a of result.alerts) {
                lines.push(`| ${a.country} | ${a.label} | ${a.last_period} | ${a.age_days - a.normal_threshold_days} |`);
              }
              lines.push('');
            }
            if (result.missing_or_unreadable_files.length) {
              lines.push('### Missing or unreadable data files');
              for (const m of result.missing_or_unreadable_files) {
                lines.push(`- ${m.country} (${m.file})${m.error ? ': ' + m.error : ''}`);
              }
            }
            const body = lines.join('\n');

            if (openIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 Data freshness alert',
                body,
                labels: [label],
              });
            }
