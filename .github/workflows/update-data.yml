name: Refresh data
on:
  schedule:
    # Hourly, every day.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd
      - name: Init pipeline log
        run: echo "" > pipeline_log.txt
      - name: Run fetch_data.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_data.py" >> pipeline_log.txt
          python fetch_data.py 2>&1 | tee -a pipeline_log.txt
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
