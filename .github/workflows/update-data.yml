      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data.json data-us.json data-ez.json data-jp.json data-in.json data-ca.json data-au.json data-kr.json data-il.json data-mx.json data-br.json data-za.json data-ma.json data-de.json data-fr.json data-it.json data-es.json data-nl.json data-dk.json data-ie.json
