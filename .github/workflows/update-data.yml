          echo ">>> RUNNING fetch_uk_age_breakdown.py" >> pipeline_log.txt
          python fetch_uk_age_breakdown.py 2>&1 | tee -a pipeline_log.txt
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data.json data-us.json data-ez.json data-jp.json data-in.json data-ca.json data-au.json data-kr.json data-il.json data-mx.json data-br.json data-za.json data-ma.json data-de.json data-fr.json data-it.json data-es.json data-nl.json data-dk.json data-ie.json data-no.json data-cl.json data-co.json data-tr.json data-id.json data-pl.json data-ch.json data-ar.json data-se.json data-sg.json data-at.json data-th.json
          git add data-uk-mpc-votes.json 2>/dev/null || true
          git add data-uk-inactivity-reasons.json 2>/dev/null || true
          git add data-uk-spending-cofog.json 2>/dev/null || true
          git add data-uk-age-breakdown.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
      - name: Check data freshness
        run: python check_data_freshness.py
      - name: Send pipeline alert email
        if: false  # disabled Aug 2026 -- OECD's live business_confidence/cpi
        # endpoints were soft-failing across most countries on most runs,
        # meaning this fired an email almost every hour. The underlying
        # detection (pipeline_log.txt, freshness_alerts.json) is untouched --
        # check the Actions tab or the open data-freshness Issue whenever
        # you want to look, instead of it landing in the inbox. To
        # re-enable: delete the "if: false" line above.
        continue-on-error: true
        run: python send_pipeline_alert.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Report freshness status via GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('freshness_alerts.json', 'utf8'));
            const problems = result.alerts.length + result.missing_or_unreadable_files.length;
            const label = 'data-freshness';

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
            });
            const openIssue = existing[0];

            if (problems === 0) {
              if (openIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  body: 'All series are back within normal freshness range as of this run.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: openIssue.number,
                  state: 'closed',
                });
              }
              return;
            }

            const lines = [
              `Checked at ${result.checked_at}. ${problems} issue(s) found.`, '',
            ];
            if (result.alerts.length) {
              lines.push('### Genuinely stale series (3x past normal update cadence)');
              lines.push('| Country | Series | Last published | Days overdue |');
              lines.push('|---|---|---|---|');
              for (const a of result.alerts) {
                lines.push(`| ${a.country} | ${a.label} | ${a.last_period} | ${a.age_days - a.normal_threshold_days} |`);
              }
              lines.push('');
            }
            if (result.missing_or_unreadable_files.length) {
              lines.push('### Missing or unreadable data files');
              for (const m of result.missing_or_unreadable_files) {
                lines.push(`- ${m.country} (${m.file})${m.error ? ': ' + m.error : ''}`);
              }
            }
            const body = lines.join('\n');

            if (openIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 Data freshness alert',
                body,
                labels: [label],
              });
            }
