name: Refresh ONS data
on:
  schedule:
    # UK morning: catches ONS releases (typically ~07:00 UK time) and any
    # Japan data not yet caught by the previous night's run.
    - cron: "30 6 * * 1-5"
    # US morning: catches BLS/BEA/Fed releases, typically 08:30 ET
    # (12:30 UTC in daylight time, 13:30 UTC in standard time).
    - cron: "30 12 * * 1-5"
    # Europe afternoon: catches ECB releases/press conferences and any
    # later US revisions.
    - cron: "30 16 * * 1-5"
    # Japan day-of: catches Cabinet Office/BoJ releases, typically ~08:50 JST,
    # which is the previous UTC evening. Sun-Thu (0-4) covers Japan's Mon-Fri.
    - cron: "50 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python fetch_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_us.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_ez.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_jp.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
      - run: python fetch_in.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          MOSPI_USERNAME: ${{ secrets.MOSPI_USERNAME }}
          MOSPI_PASSWORD: ${{ secrets.MOSPI_PASSWORD }}
      - run: python fetch_ca.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_au.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_kr.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: python fetch_uk_trade_partners.py
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - run: python fetch_boe_mpc.py
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data.json data-us.json data-ez.json data-jp.json data-in.json data-ca.json data-au.json data-kr.json
          git add data-uk-trade-partners.json 2>/dev/null || true
          git add data-uk-mpc-votes.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Refresh data"
          git push
