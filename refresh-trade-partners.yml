name: Refresh trade-partner data
on:
  schedule:
    # Once a day, well clear of the hourly "Refresh data" run's top-of-
    # hour schedule -- UN Comtrade's trade-partner breakdowns update far
    # less often than the rest of the site's data (monthly/quarterly at
    # best) and this whole job takes noticeably longer to run than the
    # main pipeline, so there's no benefit to running it hourly -- it
    # was just adding runtime and noise to every single hourly run for
    # data that hadn't actually changed.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Init trade-partners log
        run: echo "" > trade_partners_log.txt
      - name: Run fetch_uk_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_uk_trade_partners.py" >> trade_partners_log.txt
          python fetch_uk_trade_partners.py 2>&1 | tee -a trade_partners_log.txt
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - name: Run fetch_us_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_us_trade_partners.py" >> trade_partners_log.txt
          python fetch_us_trade_partners.py 2>&1 | tee -a trade_partners_log.txt
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
      - name: Run fetch_jp_trade_partners.py
        continue-on-error: true
        run: |
          echo ">>> RUNNING fetch_jp_trade_partners.py" >> trade_partners_log.txt
